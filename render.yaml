services:
  - type: web
    name: roomia-api
    env: node
    buildCommand: cd apps/api && npm install
    startCommand: cd apps/api && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

  - type: web
    name: roomia-web
    env: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: worker
    name: roomia-background-worker
    env: node
    buildCommand: cd apps/workers && npm install
    startCommand: cd apps/workers && npm start
    envVars:
      - key: NODE_ENV
        value: production
