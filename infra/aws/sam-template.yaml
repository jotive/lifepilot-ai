AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: RoomIA - AWS Infrastructure SAM Template (S3 + CloudFront + Lambda Proxy)

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 256

Resources:
  # S3 Bucket for Web Static Hosting
  RoomiaWebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'roomia-web-${AWS::AccountId}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # CloudFront CDN Distribution
  RoomiaCloudFront:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt RoomiaWebBucket.RegionalDomainName
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  # Lambda API Proxy Function
  RoomiaApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../apps/api/
      Handler: src/index.handler
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  WebURL:
    Description: URL of the RoomIA Web Application
    Value: !GetAtt RoomiaCloudFront.DomainName
  BucketName:
    Description: S3 Bucket Name for deployment
    Value: !Ref RoomiaWebBucket
