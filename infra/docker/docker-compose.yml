version: '3.8'

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: always

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    restart: always

  workers:
    build:
      context: ../../apps/workers
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
    restart: always
