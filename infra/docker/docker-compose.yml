version: '3.8'

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: always

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    restart: always
