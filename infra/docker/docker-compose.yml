version: '3.8'

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: always

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    restart: always

  inference-worker:
    build:
      context: ../../apps/workers/inference-worker
      dockerfile: ../../infra/docker/Dockerfile.inference-worker
    environment:
      - NODE_ENV=production
    restart: always

  cron-worker:
    build:
      context: ../../apps/workers/cron-worker
      dockerfile: ../../infra/docker/Dockerfile.cron-worker
    environment:
      - NODE_ENV=production
    restart: always
